name: Test Suite

# Runs on every branch push and every pull request (work branches included),
# not only on main/dev.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Disposable PostgreSQL. tests/conftest.py refuses any database whose name
    # does not end in "_test" and requires TEST_DATABASE_URL explicitly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ads_studio_test
          POSTGRES_PASSWORD: ads_studio_test
          POSTGRES_DB: ads_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads_studio_test -d ads_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (Alembic migrations are applied by the suite itself)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://ads_studio_test:ads_studio_test@localhost:5432/ads_studio_test
          # DATABASE_URL is deliberately NOT set: tests/conftest.py refuses to run if
          # it equals TEST_DATABASE_URL, and itself points the app at the disposable
          # test database above (the service container is created fresh for every run
          # and destroyed with it, so no cleanup step is needed).
          #
          # Test-only credentials (not secrets, never used outside CI). The app
          # fails fast at import without a valid Fernet key for OAuth token
          # encryption, so CI must provide one; conftest.py also pins its own.
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
          OAUTH_TOKEN_ENCRYPTION_KEY: 'PPq4rM9mxZ-0N0vXn3t2-k9RxFWyDo2AyaJISOO29Co='
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing:skip-covered

      # SECURE DATABASE MODE (what production must use): the API connects as a dedicated,
      # unprivileged LOGIN role (RUNTIME_DATABASE_URL) with APP_ENV=production -- no SET ROLE,
      # nothing to RESET ROLE to. The role is provisioned by the suite itself with the same code
      # operators use (app/scripts/provision_runtime_login.py); credentials are CI-only.
      - name: Homologate secure database mode (tenant isolation on the dedicated login role)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://ads_studio_test:ads_studio_test@localhost:5432/ads_studio_test
          RUNTIME_DATABASE_URL: postgresql://ads_homolog_login:homolog-only-password-0123@localhost:5432/ads_studio_test
          APP_ENV: production
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
          OAUTH_TOKEN_ENCRYPTION_KEY: 'PPq4rM9mxZ-0N0vXn3t2-k9RxFWyDo2AyaJISOO29Co='
        run: |
          pytest tests/integration tests/unit/test_multitenancy_api.py tests/unit/test_tenant_isolation_complete.py                  tests/unit/test_tenant_integrations.py tests/unit/test_homologation_0104.py -q --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true  # third-party upload only; the tests above are the gate

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: i18n parity and route sweep (pt-BR / en-US)
        working-directory: frontend
        run: npm run test:i18n

      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install security tools
        run: pip install bandit pip-audit

      # These are real gates: a finding fails the job (no `|| true`).
      - name: Bandit (Python SAST, medium severity and up)
        working-directory: backend
        run: bandit -r app/ -ll -ii

      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: npm audit (frontend dependencies, including dev tooling)
        working-directory: frontend
        run: npm audit --audit-level=low
