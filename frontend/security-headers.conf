# Baseline security headers for every response (included in nginx.conf at the
# server level AND in locations that define their own add_header, because
# nginx does not inherit add_header into a location that sets any).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Only takes effect over HTTPS (browsers ignore it on plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
