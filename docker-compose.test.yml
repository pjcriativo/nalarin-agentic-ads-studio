# Disposable PostgreSQL for the backend test suite. Data lives in tmpfs (RAM)
# and is discarded when the container stops. Never point tests at the dev or
# production database: tests/conftest.py refuses any DB whose name does not
# end in "_test".
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgresql://ads_studio_test:ads_studio_test@127.0.0.1:55432/ads_studio_test pytest
#   docker compose -f docker-compose.test.yml down -v
#
# (or just run scripts/test-backend.sh)
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads_studio_test
      POSTGRES_USER: ads_studio_test
      POSTGRES_PASSWORD: ads_studio_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_studio_test -d ads_studio_test"]
      interval: 2s
      timeout: 3s
      retries: 20
